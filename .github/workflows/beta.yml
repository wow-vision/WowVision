name: Beta pre-release

# One moving pre-release for testers: every push to main (or a manual run)
# moves the "beta" tag to the new commit and rebuilds the release behind it.
# The packager marks a tag containing "beta" as a pre-release, takes the
# release notes from changes-latest.md, and replaces the zip on the existing
# release, so the download link and the release page stay the same.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: beta-prerelease
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # camelot/modules.xml loads mapdata/WowNavPacked/data.xml, which tools/wownav-pack.lua
      # generates from the navigation data submodule. The packager leaves out every file git
      # does not know (it lists them with "git ls-files --others"), so the generated folder
      # is staged (not committed) to be packaged. Branches without the packer skip this.
      - name: Pack the WowNav navigation data
        run: |
          if [ -f tools/wownav-pack.lua ]; then
            sudo apt-get install -y --no-install-recommends luajit
            luajit tools/wownav-pack.lua
            git add -f mapdata/WowNavPacked
          fi

      - name: Move the beta tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f beta
          git push -f origin beta

      # The packager action skips a branch build whose commit carries a tag
      # ("future tag", it expects the tag push to build instead), and tag
      # pushes made with the workflow token start no workflow. So the
      # packager script runs here directly, told that it is building the
      # beta tag: that both passes the check and makes it pick the beta tag
      # over any release tag on the same commit.
      # The runner ignores GITHUB_* values set through the step's env map, so
      # the shell exports them itself.
      - name: Package and update the pre-release
        run: |
          export GITHUB_REF=refs/tags/beta
          export GITHUB_REF_NAME=beta
          curl -sSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o /tmp/release.sh
          bash /tmp/release.sh
